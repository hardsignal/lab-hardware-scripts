[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hardsignal-lab-power-control"
version = "0.1.0"
description = "Conservative SCPI control for Hardsignal Labs"
requires-python = ">=3.11"

[project.optional-dependencies]
hardware = ["pyvisa>=1.14", "pyvisa-py>=0.7", "pyusb>=1.2"]
dev = ["pytest>=7", "autopep8>=2", "flake8>=7"]

[tool.setuptools.packages.find]
include = ["lab_power_control*"]

[tool.setuptools.package-data]
lab_power_control = ["config/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
